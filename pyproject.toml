[project]
name = "evotrader"
version = "0.1.0"
description = "A self-improving paper trading bot that evolves and validates its own strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dashboard = [
    "matplotlib>=3.9",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[project.scripts]
evotrader = "evotrader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evotrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
